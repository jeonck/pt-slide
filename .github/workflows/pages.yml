name: Deploy GitHub Pages

# Publishes the repo as-is so every deck's viewer.html and slide-*.html open as
# real pages. GitHub serves .html from the repo tree as source; Pages serves it
# as a page, which is the whole point of this workflow.
#
# Live at https://jeonck.github.io/pt-slide/ — every push to main redeploys.
#
# Settings -> Pages -> Source is set to "GitHub Actions". That first toggle had to be
# done by a human: the workflow token deploys to an existing Pages site but cannot
# create one (actions/configure-pages returns "Resource not accessible by
# integration"). enablement: true below is now a no-op and stays as a safety net if
# the site is ever deleted and recreated.
#
# If you pick "Deploy from a branch" instead, delete this workflow — Pages will
# serve the branch directly and this job would fail on every push. .nojekyll at
# the repo root keeps that path from running the files through Jekyll.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true turns Pages on via the API, so the site does not need
      # anyone to visit Settings -> Pages first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
