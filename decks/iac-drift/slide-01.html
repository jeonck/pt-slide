<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Infrastructure drift — the change someone made by hand</title>
<style>
  @font-face { font-family:'ArchivoBlack'; src:url('./assets/fonts/ArchivoBlack-400.woff2') format('woff2'); font-weight:900; font-display:block; }
  @font-face { font-family:'Inter'; src:url('./assets/fonts/Inter-400.woff2') format('woff2'); font-weight:400; font-display:block; }
  @font-face { font-family:'Inter'; src:url('./assets/fonts/Inter-500.woff2') format('woff2'); font-weight:500; font-display:block; }
  @font-face { font-family:'Inter'; src:url('./assets/fonts/Inter-600.woff2') format('woff2'); font-weight:600; font-display:block; }
  @font-face { font-family:'Inter'; src:url('./assets/fonts/Inter-700.woff2') format('woff2'); font-weight:700; font-display:block; }
  * { margin:0; padding:0; box-sizing:border-box; }
  /* Canvas: 720x405pt. Margins 40/32pt = the spec's 0.7in/0.6in scaled by 0.75 and
     rounded to the 8pt spacing unit. Content width 640pt = 12 cols of 46.67 + 8pt gutters. */
  body {
    width:720pt; height:405pt; overflow:hidden;
    background:#F2F0EB; color:#111111;
    font-family:'Inter',sans-serif;
    padding:32pt 40pt;
    display:flex; flex-direction:column;
  }
  /* Fixed furniture. Both rails are siblings of main, so main{flex:1;min-height:0}
     pins them to a constant y on every sheet. */
  .rail { flex:none; display:flex; align-items:baseline; justify-content:space-between; gap:24pt; }
  .rail p { font-size:11pt; font-weight:500; letter-spacing:0.08em; line-height:1.4; text-transform:uppercase; }
  .rule { flex:none; height:3pt; background:#111111; }
  .rule-top { margin-top:8pt; }
  .rule-bot { margin-top:12pt; }
  main { flex:1; min-height:0; margin-top:16pt; display:flex; flex-direction:column; }
  .sg-footer { flex:none; margin-top:8pt; }
  h2 { font-family:'ArchivoBlack',sans-serif; font-weight:900; font-size:34pt; letter-spacing:-0.02em; line-height:1.2; }
  /* Square number badge: spec's diagram vocabulary. 1.4 leading even inside a fixed box. */
  .badge { flex:none; width:22pt; height:22pt; background:#111111; display:flex; align-items:center; justify-content:center; }
  .badge p { font-family:'ArchivoBlack',sans-serif; font-weight:900; font-size:12pt; line-height:1.4; color:#F2F0EB; letter-spacing:0; }
  main { justify-content:center; }
  .l1 { font-family:'ArchivoBlack',sans-serif; font-weight:900; font-size:46pt; letter-spacing:-0.03em; line-height:1.2; text-transform:uppercase; }
  .l2row { display:flex; align-items:stretch; gap:20pt; margin-top:2pt; }
  .l2 { font-family:'ArchivoBlack',sans-serif; font-weight:900; font-size:132pt; letter-spacing:-0.03em; line-height:1.2; text-transform:uppercase; color:#FF4A1C; flex:none; }
  /* rect-color-block, radius 0, no shadow. Invert ink on #111111 reads ~16:1. */
  .thesis { flex:1; background:#111111; padding:16pt 18pt; display:flex; flex-direction:column; justify-content:center; }
  .thesis p { font-family:'ArchivoBlack',sans-serif; font-weight:900; font-size:17pt; letter-spacing:-0.02em; line-height:1.3; color:#F2F0EB; text-transform:uppercase; }
  .subline { font-size:18pt; font-weight:400; line-height:1.45; margin-top:12pt; max-width:600pt; }
</style>
</head>
<body>
<div class="rail"><p>Platform engineering · internal</p><p>01 / 05</p></div>
<div class="rule rule-top"></div>
<main>
  <h1 class="l1">Infrastructure</h1>
  <div class="l2row">
    <h2 class="l2">Drift</h2>
    <div class="thesis">
      <p>The change</p>
      <p>someone made</p>
      <p>by hand</p>
    </div>
  </div>
  <p class="subline">Drift is not a tooling problem. The console is still a valid write path.</p>
</main>
<div class="rule rule-bot"></div>
<div class="sg-footer rail"><p>Presenter · Team</p><p>Infrastructure drift</p></div>
</body>
</html>
