<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>On-call rotations people can survive</title>
<style>
  @font-face { font-family:'Work Sans'; src:url('./assets/fonts/WorkSans-300.woff2') format('woff2'); font-weight:300; font-display:block; }
  @font-face { font-family:'Work Sans'; src:url('./assets/fonts/WorkSans-400.woff2') format('woff2'); font-weight:400; font-display:block; }
  @font-face { font-family:'Work Sans'; src:url('./assets/fonts/WorkSans-500.woff2') format('woff2'); font-weight:500; font-display:block; }
  @font-face { font-family:'Work Sans'; src:url('./assets/fonts/WorkSans-600.woff2') format('woff2'); font-weight:600; font-display:block; }
  * { margin:0; padding:0; box-sizing:border-box; }
  /* Canvas 720x405pt. Spec margins 1.0in x 0.8in on a 13.33in slide, scaled 0.75 and
     rounded to the 8pt spacing unit -> 56pt x 40pt. Content width 608pt.
     Height budget for main: 405 - 80 (padding) - 16.8 (kicker) - 14 (margin)
                             - 37.4 (footer rule + caption) = 256.8pt. */
  body {
    width:720pt; height:405pt; overflow:hidden;
    background:#F2EBDF; color:#3D3528;
    font-family:'Work Sans', Arial, sans-serif;
    padding:40pt 56pt;
    display:flex; flex-direction:column;
  }
  /* Fixed furniture. main{flex:1} keeps the bottom rule at the same y on all five sheets. */
  .sg-header { flex:none; display:flex; justify-content:space-between; align-items:baseline; gap:20pt; }
  .sg-header p { font-size:12pt; font-weight:600; letter-spacing:0.08em; line-height:1.4; text-transform:uppercase; }
  .kicker { color:#C2693F; }
  .counter { color:#8A8170; }
  main { flex:1; min-height:0; margin-top:14pt; display:flex; flex-direction:column; }
  .sg-footer { flex:none; margin-top:14pt; }
  .footrule { height:1pt; background:#D6CCB8; }
  /* The style's mandatory source-caption slot. This deck has no sourceable figures, so the
     slot carries that fact instead of a citation. Ink brown, not muted: muted measures
     3.25:1 on sand and this line has to be readable. */
  .sg-footer p { margin-top:7pt; font-size:11pt; font-weight:500; line-height:1.4; }
  h2 { font-size:30pt; font-weight:500; letter-spacing:-0.01em; line-height:1.2; }
  /* Cover: left text column 392pt + 24pt gap + 192pt anchor column = 608pt. */
  main { flex-direction:row; align-items:center; gap:24pt; }
  .lede { width:392pt; flex:none; }
  h1 { font-size:42pt; font-weight:500; letter-spacing:-0.01em; line-height:1.25; }
  .titlerule { height:1pt; background:#D6CCB8; margin:20pt 0 18pt; }
  .sub { font-size:18pt; font-weight:400; line-height:1.5; }
  .presenter { margin-top:22pt; font-size:12pt; font-weight:500; letter-spacing:0.08em; line-height:1.4; text-transform:uppercase; color:#8A8170; }
  /* Visual anchor: one shift drawn as a terracotta arc on a 1pt ink ring, with a hollow
     handover marker at each end. Deliberately shows no countable people - any number of
     markers on the ring would assert a roster size this deck cannot source. */
  /* svg is inline-level by default, so it sits on a text baseline and drops ~24pt of
     descender space between the ring and its caption. display:block removes it. */
  .anchor { flex:1; display:flex; flex-direction:column; align-items:center; }
  .anchor svg { display:block; }
  .anchor .figcap { margin-top:10pt; font-size:11pt; font-weight:500; line-height:1.4; text-align:center; }
</style>
</head>
<body>
<div class="sg-header"><p class="kicker">On-call design</p><p class="counter">01 / 05</p></div>
<main>
  <div class="lede">
    <h1>On-call rotations<br>people can survive</h1>
    <div class="titlerule"></div>
    <p class="sub">Rotation design is a staffing problem,<br>not a goodwill problem.</p>
    <p class="presenter">Presenter · Team</p>
  </div>
  <figure class="anchor">
    <svg width="152pt" height="152pt" viewBox="14 14 140 140" role="img" aria-label="A rotation ring with one shift marked and a handover at each end">
      <circle cx="84" cy="84" r="66" fill="none" stroke="#3D3528" stroke-width="1"></circle>
      <path d="M 21.98 61.43 A 66 66 0 0 1 106.57 21.98" fill="none" stroke="#C2693F" stroke-width="1.5" stroke-linecap="round"></path>
      <circle cx="21.98" cy="61.43" r="5" fill="#F2EBDF" stroke="#3D3528" stroke-width="1"></circle>
      <circle cx="106.57" cy="21.98" r="5" fill="#F2EBDF" stroke="#3D3528" stroke-width="1"></circle>
    </svg>
    <p class="figcap">One shift. Two handovers.</p>
  </figure>
</main>
<div class="sg-footer">
  <div class="footrule"></div>
  <p>No sourced figures: shift hours, page rates and roster sizes are unsourced.</p>
</div>
</body>
</html>
