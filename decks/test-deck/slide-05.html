<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Q&amp;A</title>
<style>
  @font-face { font-family: 'Pretendard'; src: url('./assets/fonts/Pretendard-Regular.woff2') format('woff2'); font-weight: 400; font-display: block; }
  @font-face { font-family: 'Pretendard'; src: url('./assets/fonts/Pretendard-SemiBold.woff2') format('woff2'); font-weight: 600; font-display: block; }
  @font-face { font-family: 'Pretendard'; src: url('./assets/fonts/Pretendard-Bold.woff2') format('woff2'); font-weight: 700; font-display: block; }
  @font-face { font-family: 'Pretendard'; src: url('./assets/fonts/Pretendard-ExtraBold.woff2') format('woff2'); font-weight: 800; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720pt; height: 405pt; overflow: hidden;
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif; word-break: keep-all;
    background: #0B2C5C; color: #FFFFFF;
    padding: 34pt 38pt 26pt 38pt;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .chip { display: inline-block; background: #1B66C9; color: #FFFFFF; font-size: 11pt; font-weight: 700; letter-spacing: 0.06em; padding: 5pt 11pt; }
  .mid { display: flex; gap: 42pt; align-items: flex-start; }
  .rule { width: 4pt; background: #1B66C9; align-self: stretch; flex: none; }
  .lead { width: 232pt; flex: none; }
  .lead h1 { font-size: 54pt; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; color: #FFFFFF; }
  .lead p { font-size: 15pt; font-weight: 400; line-height: 1.5; color: #C5D2E3; margin-top: 14pt; }
  ul.qs { list-style: none; flex: 1; min-width: 0; }
  ul.qs li { display: flex; gap: 12pt; align-items: flex-start; padding-bottom: 12pt; border-bottom: 1px solid #3A5B87; }
  ul.qs li + li { padding-top: 12pt; }
  .sq { width: 22pt; height: 22pt; flex: none; background: #1B66C9; display: flex; align-items: center; justify-content: center; }
  .sq p { font-size: 11pt; font-weight: 700; color: #FFFFFF; }
  ul.qs li p.q { font-size: 15pt; font-weight: 600; line-height: 1.4; color: #E8F1FB; padding-top: 2pt; }
  .foot { border-top: 1px solid #3A5B87; padding-top: 12pt; display: flex; justify-content: space-between; align-items: baseline; }
  .foot .thanks { font-size: 13pt; font-weight: 700; color: #FFFFFF; letter-spacing: -0.01em; }
  .foot .who { font-size: 11pt; font-weight: 400; color: #8FA6C4; }


  /* 파워포인트 안전 여백: text 엔진은 텍스트 상자가 아래 가장자리에서 0.5in 이상
     떨어지기를 요구한다. 엔진이 재는 값은 DOM 여백보다 약 8pt 크게 나온다. */
  body { padding-bottom: 30pt; }
</style>
</head>
<body>

  <div>
    <p class="chip">논의</p>
  </div>

  <div class="mid">
    <div class="rule"></div>
    <div class="lead">
      <h1>Q&amp;A</h1>
      <p>함께 정하고 싶은 세 가지</p>
    </div>
    <ul class="qs">
      <li><div class="sq"><p>01</p></div><p class="q">우리 조직에서 가장 먼저 맡길 업무는 무엇인가</p></li>
      <li><div class="sq"><p>02</p></div><p class="q">사람이 반드시 확인해야 하는 지점은 어디인가</p></li>
      <li><div class="sq"><p>03</p></div><p class="q">성과는 무엇으로 측정할 것인가</p></li>
    </ul>
  </div>

  <div class="foot">
    <p class="thanks">감사합니다</p>
    <p class="who">발표자 · 소속</p>
  </div>

</body>
</html>
