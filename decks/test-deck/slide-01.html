<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>인공지능의 미래와 업무 자동화 — 커버</title>
<style>
  @font-face { font-family: 'Pretendard'; src: url('./assets/fonts/Pretendard-Regular.woff2') format('woff2'); font-weight: 400; font-display: block; }
  @font-face { font-family: 'Pretendard'; src: url('./assets/fonts/Pretendard-SemiBold.woff2') format('woff2'); font-weight: 600; font-display: block; }
  @font-face { font-family: 'Pretendard'; src: url('./assets/fonts/Pretendard-Bold.woff2') format('woff2'); font-weight: 700; font-display: block; }
  @font-face { font-family: 'Pretendard'; src: url('./assets/fonts/Pretendard-ExtraBold.woff2') format('woff2'); font-weight: 800; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720pt; height: 405pt; overflow: hidden;
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif; word-break: keep-all;
    background: #0B2C5C; color: #FFFFFF;
    padding: 34pt 38pt 26pt 38pt;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .chip { display: inline-block; background: #1B66C9; color: #FFFFFF; font-size: 11pt; font-weight: 700; letter-spacing: 0.06em; padding: 5pt 11pt; }
  .rule { width: 4pt; background: #1B66C9; align-self: stretch; }
  .title { font-size: 38pt; font-weight: 800; letter-spacing: -0.02em; line-height: 1.28; color: #FFFFFF; }
  .sub { font-size: 15pt; font-weight: 400; line-height: 1.5; color: #C5D2E3; margin-top: 14pt; }
  .foot { border-top: 1px solid #3A5B87; padding-top: 12pt; display: flex; gap: 46pt; }
  .foot-label { font-size: 10pt; font-weight: 400; color: #8FA6C4; margin-bottom: 4pt; }
  .foot-value { font-size: 12pt; font-weight: 600; color: #E8F1FB; }
</style>
</head>
<body>

  <div>
    <p class="chip">AI 전환 브리핑</p>
  </div>

  <div style="display: flex; gap: 20pt; padding-right: 92pt;">
    <div class="rule"></div>
    <div>
      <h1 class="title">인공지능의 미래와<br>업무 자동화</h1>
      <p class="sub">생성형 AI 이후, 일하는 방식은 어떻게 재편되는가</p>
    </div>
  </div>

  <div class="foot">
    <div>
      <p class="foot-label">발표</p>
      <p class="foot-value">발표자 · 소속</p>
    </div>
    <div>
      <p class="foot-label">일자</p>
      <p class="foot-value">2026. 08</p>
    </div>
    <div>
      <p class="foot-label">구분</p>
      <p class="foot-value">사내 공유용</p>
    </div>
  </div>

</body>
</html>
