<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feature Store — adoption review</title>
<style>
  @font-face { font-family:'Inter'; src:url('./assets/fonts/Inter-400.woff2') format('woff2'); font-weight:400; font-display:block; }
  @font-face { font-family:'Inter'; src:url('./assets/fonts/Inter-500.woff2') format('woff2'); font-weight:500; font-display:block; }
  @font-face { font-family:'Inter'; src:url('./assets/fonts/Inter-600.woff2') format('woff2'); font-weight:600; font-display:block; }
  @font-face { font-family:'Inter'; src:url('./assets/fonts/Inter-700.woff2') format('woff2'); font-weight:700; font-display:block; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:720pt; height:405pt; overflow:hidden;
    background:#FFFFFF; color:#1A1A1A;
    font-family:'Inter',Arial,sans-serif;
    padding:27pt 32pt 20pt 32pt;
    display:flex; flex-direction:column;
  }
  /* Action title band: one declarative line, kicker beneath. Fixed so the body starts
     at the same y on every sheet — a wrapped title would push everything down. */
  .sg-header { height:50pt; flex:none; }
  h1 { font-size:20pt; font-weight:600; letter-spacing:-0.01em; line-height:1.3; }
  .kicker { font-size:11pt; font-weight:500; letter-spacing:0.04em; color:#7A828F; margin-top:6pt; }
  main { flex:1; min-height:0; margin-top:14pt; display:flex; flex-direction:column; }
  h2 { font-size:16pt; font-weight:600; line-height:1.3; }
  p { font-size:14pt; font-weight:400; line-height:1.45; color:#3D4350; }
  .lead { color:#1A1A1A; }
  .muted { color:#7A828F; }
  .label { font-size:11pt; font-weight:500; letter-spacing:0.06em; color:#7A828F; }
  .cell { border:1px solid #C9CDD3; padding:13pt 14pt; display:flex; flex-direction:column; }
  /* The one filled box in the deck. The spec forbids emphasising with colour anywhere else. */
  .fill { background:#1F3A5F; border-color:#1F3A5F; }
  .fill h2, .fill p { color:#FFFFFF; }
  .badge { width:22pt; height:22pt; flex:none; background:#1F3A5F; display:flex; align-items:center; justify-content:center; }
  .badge p { font-size:12pt; font-weight:600; color:#FFFFFF; line-height:1.4; }
  .sg-footer { flex:none; margin-top:12pt; text-align:right; }
  .sg-footer p { font-size:10pt; font-weight:400; color:#7A828F; letter-spacing:0.03em; }

  /* 파워포인트 안전 여백: text 엔진은 텍스트 상자가 아래 가장자리에서 0.5in 이상
     떨어지기를 요구하고, 엔진이 재는 값은 DOM 여백보다 약 8pt 크게 나온다. */
  body { padding-bottom: 30pt; }
</style>
</head>
<body>
<div class="sg-header">
  <h1>Feature Store — adoption review</h1>
  <p class="kicker">ML PLATFORM / DECISION REVIEW</p>
</div>
<main>
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
    <p class="lead" style="font-size:18pt; line-height:1.45; max-width:480pt;">A feature store is a decision about ownership,<br>not about tooling.</p>
  </div>
  <div style="display:flex; gap:54pt; padding-top:14pt; border-top:1px solid #C9CDD3;">
    <div><p class="label" style="margin-bottom:5pt;">PREPARED BY</p><p class="lead" style="font-weight:500;">PRESENTER · TEAM</p></div>
    <div><p class="label" style="margin-bottom:5pt;">DATE</p><p class="lead" style="font-weight:500;">2026.08</p></div>
    <div><p class="label" style="margin-bottom:5pt;">AUDIENCE</p><p class="lead" style="font-weight:500;">ML PLATFORM &amp; DATA ENG</p></div>
  </div>
</main>
<div class="sg-footer"><p>FEATURE STORE — ADOPTION REVIEW · SHEET 01/06 · FRAMEWORK ONLY, NO EXTERNAL DATA</p></div>
</body>
</html>
