<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MLOps Platform Roadmap</title>
<style>
  @font-face { font-family:'Arimo'; src:url('./assets/fonts/Arimo-400.woff2') format('woff2'); font-weight:400; font-display:block; }
  @font-face { font-family:'Arimo'; src:url('./assets/fonts/Arimo-700.woff2') format('woff2'); font-weight:700; font-display:block; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:720pt; height:405pt; overflow:hidden;
    background:#FFFFFF; color:#1A1A1A;
    font-family:'Arimo','Helvetica Neue',sans-serif;
    padding:22pt 32pt 20pt 32pt;
    display:flex; flex-direction:column;
  }
  /* Header band: kicker + one-line action title, fixed height so the rule never moves. */
  .sg-header { height:54pt; flex:none; display:flex; flex-direction:column; justify-content:flex-end; }
  .kicker { font-size:11pt; font-weight:700; letter-spacing:0.08em; color:#6B7280; margin-bottom:7pt; }
  h1 { font-size:20pt; font-weight:700; letter-spacing:-0.01em; line-height:1.25; }
  .rule { height:1px; background:#D1D5DB; flex:none; margin-bottom:16pt; }
  main { flex:1; min-height:0; display:flex; flex-direction:column; }
  h2 { font-size:15pt; font-weight:700; line-height:1.3; }
  p { font-size:14pt; font-weight:400; line-height:1.4; }
  .muted { color:#6B7280; }
  .num { font-size:14pt; font-weight:700; letter-spacing:0.04em; color:#6B7280; }
  .cell { border:1px solid #D1D5DB; padding:14pt 15pt; display:flex; flex-direction:column; }
  .cell.active { border-left:4px solid #0B5FFF; background:#F4F5F7; }
  /* Source caption: fixed bottom-right on every sheet, per the style signature. */
  .sg-footer { flex:none; margin-top:12pt; text-align:right; }
  .sg-footer p { font-size:10pt; font-weight:400; color:#6B7280; letter-spacing:0.04em; }

  /* 파워포인트 안전 여백: text 엔진은 텍스트 상자가 아래 가장자리에서 0.5in 이상
     떨어지기를 요구하고, 엔진이 재는 값은 DOM 여백보다 약 8pt 크게 나온다. */
  body { padding-bottom: 30pt; }
</style>
</head>
<body>
<div class="sg-header">
  <p class="kicker">PLATFORM ENGINEERING / 2026</p>
  <h1>MLOps Platform Roadmap</h1>
</div>
<div class="rule"></div>
<main>
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
    <div style="height:4px; width:120pt; background:#0B5FFF; margin-bottom:22pt;"></div>
    <p style="font-size:17pt; line-height:1.45; max-width:470pt;">What to build first, what to buy,<br>and what to stop each phase on.</p>
  </div>
  <div style="display:flex; gap:52pt; padding-top:14pt; border-top:1px solid #D1D5DB;">
    <div><p style="font-size:11pt; font-weight:700; letter-spacing:0.08em; color:#6B7280; margin-bottom:5pt;">PREPARED BY</p><p style="font-size:14pt;">PRESENTER · TEAM</p></div>
    <div><p style="font-size:11pt; font-weight:700; letter-spacing:0.08em; color:#6B7280; margin-bottom:5pt;">DATE</p><p style="font-size:14pt;">2026.08</p></div>
    <div><p style="font-size:11pt; font-weight:700; letter-spacing:0.08em; color:#6B7280; margin-bottom:5pt;">AUDIENCE</p><p style="font-size:14pt;">PLATFORM &amp; ML LEADS</p></div>
  </div>
</main>
<div class="sg-footer"><p>MLOPS PLATFORM ROADMAP · SHEET 01/07 · NO EXTERNAL DATA CITED</p></div>
</body>
</html>
