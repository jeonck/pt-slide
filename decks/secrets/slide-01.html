<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Revocability is the standard</title>
<style>
  @font-face { font-family:'Anton'; src:url('./assets/fonts/Anton-Regular.woff2') format('woff2'); font-weight:400; font-display:block; }
  @font-face { font-family:'Archivo'; src:url('./assets/fonts/Archivo-400.woff2') format('woff2'); font-weight:400; font-display:block; }
  @font-face { font-family:'Archivo'; src:url('./assets/fonts/Archivo-600.woff2') format('woff2'); font-weight:600; font-display:block; }
  @font-face { font-family:'Archivo'; src:url('./assets/fonts/Archivo-700.woff2') format('woff2'); font-weight:700; font-display:block; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:720pt; height:405pt; overflow:hidden;
    font-family:'Archivo', sans-serif;
    background:#1F3DFF; color:#FFFFFF;
    padding:36pt 36pt 22pt;
    display:flex; flex-direction:column;
  }
  main { flex:1; min-height:0; display:flex; flex-direction:column; }
  .eyebrow {
    font-family:'Archivo'; font-weight:700; font-size:11pt;
    letter-spacing:0.08em; text-transform:uppercase; line-height:1.4;
    margin-bottom:12pt;
  }
  h1 {
    font-family:'Anton', 'Arial Black', sans-serif; font-weight:400;
    font-size:66pt; letter-spacing:-0.01em; line-height:1.5;
    margin-bottom:14pt;
  }
  .rule { height:4pt; background:#FFFFFF; margin-bottom:18pt; }
  .lede {
    font-family:'Archivo'; font-weight:600; font-size:17pt; line-height:1.4;
    text-wrap:balance;
  }
  footer {
    display:flex; justify-content:space-between; align-items:baseline;
    margin-top:18pt;
  }
  footer p {
    font-family:'Archivo'; font-weight:400; font-size:10.5pt; line-height:1.4;
  }
  footer .page { font-weight:700; letter-spacing:0.08em; }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Secrets &middot; Platform engineering</p>
    <h1>Revocability<br>is the standard</h1>
    <div class="rule"></div>
    <p class="lede">The rule is not &ldquo;don&rsquo;t commit secrets.&rdquo; It is: how long does it take to revoke one &mdash; and that answer decides where a secret lives and how long it lasts.</p>
  </main>
  <footer>
    <p>Presenter &middot; Team</p>
    <p class="page">01</p>
  </footer>
</body>
</html>
